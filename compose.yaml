services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: amortization-app:latest
    container_name: amortization-app
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    restart: unless-stopped

